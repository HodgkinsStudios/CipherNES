app-id: io.github.hodgkinsstudios.CipherNES
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ciphernes

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro

modules:
  - name: ciphernes
    buildsystem: simple
    build-commands:
      - chmod +x build_ubuntu.sh
      - ./build_ubuntu.sh
      - install -Dm755 build/ubuntu/bin/CipherNES /app/lib/ciphernes/CipherNES
      - install -Dm755 ciphernes-flatpak-launcher.sh /app/bin/ciphernes
      - install -Dm644 io.github.hodgkinsstudios.CipherNES.desktop /app/share/applications/io.github.hodgkinsstudios.CipherNES.desktop
      - install -Dm644 io.github.hodgkinsstudios.CipherNES.metainfo.xml /app/share/metainfo/io.github.hodgkinsstudios.CipherNES.metainfo.xml
      - install -Dm644 io.github.hodgkinsstudios.CipherNES.svg /app/share/icons/hicolor/scalable/apps/io.github.hodgkinsstudios.CipherNES.svg
      - install -Dm644 LICENSE /app/share/licenses/io.github.hodgkinsstudios.CipherNES/LICENSE
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/doc/ciphernes/THIRD_PARTY_NOTICES.md
      - install -Dm644 README.md /app/share/doc/ciphernes/README.md
      - install -Dm644 bios/README.md /app/share/doc/ciphernes/bios/README.md
    sources:
      - type: git
        url: https://github.com/HodgkinsStudios/CipherNES.git
        branch: main
      - type: file
        path: ciphernes-flatpak-launcher.sh
      - type: file
        path: io.github.hodgkinsstudios.CipherNES.desktop
      - type: file
        path: io.github.hodgkinsstudios.CipherNES.metainfo.xml
      - type: file
        path: io.github.hodgkinsstudios.CipherNES.svg

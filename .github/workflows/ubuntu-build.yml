name: Ubuntu build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ubuntu-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-2.0-0 zlib1g xvfb xauth

      - name: Validate semantic release version
        shell: bash
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "RELEASE_NOTES_${version}.md"

      - name: Build CipherNES for Ubuntu
        run: ./build_ubuntu.sh

      - name: Native Ubuntu CLI smoke check
        run: build/ubuntu/bin/CipherNES --help

      - name: First-launch storage layout smoke test
        run: |
          sandbox_home="$(mktemp -d)"
          HOME="$sandbox_home" build/ubuntu/bin/CipherNES --help
          for folder in Saves SaveState Screenshots Videos Cheats TAS bios config logs roms; do
            test -d "$sandbox_home/.local/share/HodgkinsStudios/CipherNES/$folder"
          done
          test ! -d build/ubuntu/bin/bios
          CIPHERNES_RUNTIME_DIR="$(mktemp -d)" build/ubuntu/bin/CipherNES --help

      - name: SDL frontend startup smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          CIPHERNES_SKIP_INITIAL_CONTROLLER_SCAN: "1"
        run: |
          xvfb-run -a build/ubuntu/bin/CipherNES --ui-preview "$RUNNER_TEMP/ciphernes-preview.png"
          test -s "$RUNNER_TEMP/ciphernes-preview.png"

      - name: Package Ubuntu release ZIP
        run: |
          CIPHERNES_SKIP_BUILD=1 ./package_release.sh
          test -s dist/CipherNES-1.0.2-Ubuntu-x86_64.zip
          unzip -l dist/CipherNES-1.0.2-Ubuntu-x86_64.zip | grep -F 'RELEASE_NOTES_1.0.2.md'

      - name: Upload Ubuntu release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CipherNES-Ubuntu
          path: |
            dist/CipherNES-1.0.2-Ubuntu-x86_64.zip
            dist/SHA256SUMS.txt

name: Build v1.0.1 draft release candidates (no Actions artifact quota)

on:
  push:
    branches:
      - release/v1.0.1-candidate
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  CIPHERNES_CANDIDATE_TAG: v1.0.1-platform-parity-rc2

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create unpublished candidate release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$CIPHERNES_CANDIDATE_TAG" >/dev/null 2>&1; then
            gh release create "$CIPHERNES_CANDIDATE_TAG" --draft --prerelease \
              --target "$GITHUB_SHA" \
              --title "CipherNES 1.0.1 — draft cross-platform release candidate" \
              --notes-file RELEASE_NOTES_1.0.1.md
          fi
      - name: Prepare ROM-free source snapshot from this exact commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import os, subprocess, zipfile
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\x00")
          archive = "dist/CipherNES-1.0.1-Exact-Source-ROM-Free.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for raw_path in paths:
                  if not raw_path:
                      continue
                  p = os.fsdecode(raw_path)
                  if p.startswith("TEST_ROMS/") or p.lower().endswith((".nes", ".fds", ".qd", ".sav", ".nss", ".avi")):
                      continue
                  if os.path.isfile(p):
                      z.write(p, "CipherNES-1.0.1/" + p)
          print("Created", archive)
          PY
          printf '%s\n' "$GITHUB_SHA" > dist/CipherNES-1.0.1-Source-COMMIT.txt
          sha256sum dist/*.zip > dist/CipherNES-1.0.1-Source-SHA256SUMS.txt
          gh release upload "$CIPHERNES_CANDIDATE_TAG" \
            dist/CipherNES-1.0.1-Exact-Source-ROM-Free.zip \
            dist/CipherNES-1.0.1-Source-SHA256SUMS.txt \
            dist/CipherNES-1.0.1-Source-COMMIT.txt --clobber

  ubuntu:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build, package, validate native Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-2.0-0 zlib1g zip xvfb xauth
          python3 .github/ci/check_release_version.py
          ./package_release.sh
          python3 .github/ci/make_synthetic_rom.py "$RUNNER_TEMP/ciphernes.nes"
          build/ubuntu/bin/CipherNES --validate "$RUNNER_TEMP/ciphernes.nes" 24
          cp dist/SHA256SUMS.txt dist/CipherNES-1.0.1-Ubuntu-SHA256SUMS.txt
          gh release upload "$CIPHERNES_CANDIDATE_TAG" \
            dist/CipherNES-1.0.1-Ubuntu-x86_64.zip \
            dist/CipherNES-1.0.1-Ubuntu-SHA256SUMS.txt --clobber

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows compiler and runtimes
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
      - name: Build, validate and attach Windows binary
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:MSYS2_LOCATION\mingw64\bin;$env:PATH"
          .\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows compiler failed" }
          $exe = "build/windows/bin/CipherNES.exe"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Windows --help smoke failed" }
          & $exe --sdl-runtime-test
          if ($LASTEXITCODE -ne 0) { throw "Windows SDL loader failed" }
          $rom = Join-Path $env:RUNNER_TEMP "ciphernes-synthetic.nes"
          python .github/ci/make_synthetic_rom.py $rom
          & $exe --validate $rom 24
          if ($LASTEXITCODE -ne 0) { throw "Windows core validation failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/windows/bin/*" -DestinationPath "dist/CipherNES-1.0.1-Windows-x86_64.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "dist/CipherNES-1.0.1-Windows-x86_64.zip").Hash.ToLowerInvariant()
          "$hash  CipherNES-1.0.1-Windows-x86_64.zip" | Set-Content -Encoding ASCII "dist/CipherNES-1.0.1-Windows-SHA256SUMS.txt"
          & gh release upload $env:CIPHERNES_CANDIDATE_TAG "dist/CipherNES-1.0.1-Windows-x86_64.zip" "build/windows/bin/CipherNES.exe" "dist/CipherNES-1.0.1-Windows-SHA256SUMS.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Windows release candidate upload failed" }

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, validate and attach native macOS
        shell: bash
        run: |
          set -euo pipefail
          brew install sdl2
          chmod +x build_macos.sh
          ./build_macos.sh
          test "$(uname -m)" = "${{ matrix.arch }}"
          bin="build/macos/CipherNES-macOS-${{ matrix.arch }}-single-file"
          "$bin" --help
          python3 .github/ci/make_synthetic_rom.py "$RUNNER_TEMP/ciphernes.nes"
          "$bin" --validate "$RUNNER_TEMP/ciphernes.nes" 24
          cp build/macos/SHA256SUMS.txt build/macos/CipherNES-macOS-${{ matrix.arch }}-SHA256SUMS.txt
          gh release upload "$CIPHERNES_CANDIDATE_TAG" \
            build/macos/CipherNES-macOS-${{ matrix.arch }}.zip \
            "$bin" \
            build/macos/CipherNES-macOS-${{ matrix.arch }}-SHA256SUMS.txt --clobber

  debian:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-2.0-0 zlib1g
          ./packaging/debian/build_deb.sh
          sudo dpkg -i dist/CipherNES-1.0.1-amd64.deb
          ciphernes --help
          gh release upload "$CIPHERNES_CANDIDATE_TAG" \
            dist/CipherNES-1.0.1-amd64.deb \
            dist/CipherNES-1.0.1-amd64.deb.sha256 --clobber

  appimage:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test AppImage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-2.0-0 zlib1g curl \
            appstream desktop-file-utils elfutils librsvg2-common libgdk-pixbuf2.0-bin
          ./packaging/appimage/build_appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 dist/CipherNES-1.0.1-x86_64.AppImage --help
          gh release upload "$CIPHERNES_CANDIDATE_TAG" \
            dist/CipherNES-1.0.1-x86_64.AppImage \
            dist/CipherNES-1.0.1-x86_64.AppImage.sha256 --clobber

  flatpak:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak SDK and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils \
            elfutils librsvg2-common libgdk-pixbuf2.0-bin
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build, install and attach Flatpak
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/flatpak/build_flatpak.sh
          flatpak install --user --noninteractive -y ./dist/CipherNES-1.0.1-x86_64.flatpak
          flatpak run io.github.hodgkinsstudios.CipherNES --help
          gh release upload "$CIPHERNES_CANDIDATE_TAG" \
            dist/CipherNES-1.0.1-x86_64.flatpak \
            dist/CipherNES-1.0.1-x86_64.flatpak.sha256 --clobber

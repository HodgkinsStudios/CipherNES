name: macOS build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: macos-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Build CipherNES for macOS
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Native macOS CLI smoke check
        run: |
          build/macos/CipherNES-macOS-${{ matrix.arch }}-single-file --help
          test -d "$HOME/Library/Application Support/HodgkinsStudios/CipherNES/bios"

      - name: Core ROM execution and state round-trip on macOS
        run: |
          python3 .github/ci/make_synthetic_rom.py "${{ runner.temp }}/ciphernes-synthetic.nes"
          build/macos/CipherNES-macOS-${{ matrix.arch }}-single-file --validate \
            "${{ runner.temp }}/ciphernes-synthetic.nes" 24

      - name: Hosted macOS SDL loader diagnostic (best effort)
        continue-on-error: true
        timeout-minutes: 1
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_JOYSTICK_HIDAPI: "0"
          SDL_JOYSTICK_IOKIT: "0"
          SDL_JOYSTICK_MFI: "0"
        run: |
          # On GitHub's unattended macOS desktop, dyld/SDL3-compat can hang.
          # Keep a bounded diagnostic, but never prevent publishing validated
          # native core builds. Real-device SDL startup still requires testing.
          perl -e 'alarm 15; exec @ARGV' -- \
            build/macos/CipherNES-macOS-${{ matrix.arch }}-single-file --sdl-runtime-test

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: CipherNES-macOS-${{ matrix.arch }}
          path: |
            build/macos/CipherNES-macOS-${{ matrix.arch }}.zip
            build/macos/CipherNES-macOS-${{ matrix.arch }}-single-file
            build/macos/SHA256SUMS.txt
